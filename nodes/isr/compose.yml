networks:
  isrNet:
    driver: bridge
    name: isrNet
    enable_ipv6: true
    ipam:
      config:
        - subnet: fde4:492a:fc7d::/48

volumes:
  i2pd_data:

include:
  # General IP network definitions
  - networks.yml

  # I2P router
  - i2p/i2p.yml

  # Tor router
  #- tor/tor.yml

services:
  host-statistics:
    extends:
      file: ../../services/node_exporter/compose.yml
      service: statistics
    restart: unless-stopped
    
  yggdrasil:
    extends:
      file: ../../services/yggdrasil/compose.yml
      service: yggdrasil
    restart: unless-stopped
    network_mode: "host"

  mycelium:
    extends:
      file: ../../services/mycelium/compose.yml
      service: mycelium
    container_name: mycelium
    restart: unless-stopped
    network_mode: "host"

