services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    # Place in same network namespace as `paperless_ui_proxy`
    network_mode: service:paperless_ui_proxy
    user: ${USER_UID}:${USER_GID}
    volumes:
      # Consumption path
      - ${PAPERLESS_CONSUME_PATH}:/usr/src/paperless/consume:z
      # Export path
      - ${PAPERLESS_EXPORT_PATH}:/usr/src/paperless/export:z
      # Media path
      - ${PAPERLESS_MEDIA_PATH}:/usr/src/paperless/media:z
      # Data path
      - ${PAPERLESS_DATA_PATH}:/usr/src/paperless/data:z
    environment:
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=localhost
      - PAPERLESS_DBPORT=5432
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=${PAPERLESS_DB_USERNAME}
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}


  paperless_db:
    image: postgres:latest
    container_name: paperless_db
    restart: unless-stopped
    # Place in same network namespace as `paperless`
    network_mode: service:paperless
    environment:
      - POSTGRES_USER=${PAPERLESS_DB_USERNAME}
      - POSTGRES_PASSWORD=${PAPERLESS_DB_PASSWORD}
      - POSTGRES_DB=paperless
    volumes: 
      # Database storage
      - ${PAPERLESS_DB_PATH}:/var/lib/postgresql:z

  # Reverse proxy with HTTPS for `paperless`
  paprless_ui_proxy:
    build:
      context: ui/
    container_name: paprless_ui_proxy
    restart: unless-stopped
    environment:
      - "DOMAIN=${PAPERLESS_DOMAIN}"
      - "DOMAIN_1=${PAPERLESS_DOMAIN_1}"
      - "DOMAIN_2=${PAPERLESS_DOMAIN_2}"
      - "WHERE_TO_ADDR=[::1]"
      - "WHERE_TO_PORT=80"
      - "DEBUG_LEVEL=INFO"
    networks:
      ipv6_pool_net:
        ipv6_address: ${PAPERLESS_IPV6_ADDR}
      ygg_pool_net:
        ipv6_address: ${PAPERLESS_YGG_ADDR}
    ports:
      # Expose https and http
      - 443/tcp
      - 80/tcp
