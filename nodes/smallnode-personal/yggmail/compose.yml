services:
  # Yggmail auto
  yggmail:
    extends:
      file: ../../../services/yggmail-auto/compose.yml
      service: yggmail
    container_name: yggmail
    restart: unless-stopped
    user: ${USER_UID}:${USER_GID}
    # Place in same network namespace as `yggmail_tls`
    network_mode: service:yggmail_tls

  # Automatic TLS reverse proxy (with SNI)
  yggmail_tls:
    build:
      context: tls
    container_name: yggmail_tls
    restart: unless-stopped
    user: ${USER_UID}:${USER_GID}
    environment:
      # Ued to encrypt TLS secrets (FIXME: Determine what this is for)
      - TLSPROXY_PASSPHRASE=${YGGMAIL_TLS_PASSWORD}
    volumes:
      - ${YGGMAIL_TLS_CACHE_DIR}:/.cache:z
    networks:
      ipv6_pool_net:
        ipv6_address: ${IPV6_ADDR_TLS_YGGMAIL}
      ygg_pool_net:
        ipv6_address: ${YGG_ADDR_YGGMAIL}
    ports:
      # TLS endpoint
      - 1111/tcp

      # ACME must listen ALWAYS on port 80
      # (if you have conflicts then place)
      # this onto a seperate network
      - 80/tcp

      # Expose for non-TLS users (like over Yggdrasil)
      - 1143/tcp #IMAP
      - 1025/tcp #SMTP

  # RoundCube storage (Postgres)
  yggmail_ui_db:
    container_name: yggmail_ui_db
    image: postgres:latest
    restart: unless-stopped
    user: ${USER_UID}:${USER_GID}
    # Run in same network namespace as `yggmail_ui`
    network_mode: service:yggmail_ui
    environment:
      - POSTGRES_USER=${YGGMAIL_UI_DB_USERNAME}
      - POSTGRES_PASSWORD=${YGGMAIL_UI_DB_PASSWORD}
    volumes:
      # Database storage
      - ${YGGMAIL_UI_DB_PATH}:/var/lib/postgresql:z

  # RoundCube mail UI
  yggmail_ui:
    container_name: yggmail_ui
    image: roundcube/roundcubemail
    restart: unless-stopped
    depends_on:
      - yggmail
    # Didn't want to run under these permissions
    # (I think it wanted elavted permissions to
    # try force running under a different user -
    # something one can only do with effective
    # root uid permissions)
    # user: ${USER_UID}:${USER_GID}
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=${YGGMAIL_UI_DOMAIN_IMAP}
      - ROUNDCUBEMAIL_SMTP_SERVER=${YGGMAIL_UI_DOMAIN_SMTP}

      # Point it to the YggMail instance
      - ROUNDCUBEMAIL_SMTP_PORT=1025
      - ROUNDCUBEMAIL_DEFAULT_PORT=1143

      # Use Postgres for storing data
      - ROUNDCUBEMAIL_DB_TYPE=pgsql
      - ROUNDCUBEMAIL_DB_HOST=::1
      - ROUNDCUBEMAIL_DB_PORT=5432
      - ROUNDCUBEMAIL_DB_USER=${YGGMAIL_UI_DB_USERNAME}
      - ROUNDCUBEMAIL_DB_PASSWORD=${YGGMAIL_UI_DB_PASSWORD}
    # Run in same network namespace as `yggmail_ui_proxy`
    network_mode: service:yggmail_ui_proxy
    volumes:
      # Temporary storage
      - ${YGGMAIL_UI_TEMP_PATH}:/tmp/roundcube-temp:z

      # SQLite DB storage
      # - ${YGGMAIL_UI_DB_PATH}:/var/roundcube/db:z
          
  # Reverse proxy with HTTPS for `gitea`
  yggmail_ui_proxy:
    build:
      context: ui/
    container_name: yggmail_ui_proxy
    restart: unless-stopped
    environment:
      - "DOMAIN=${YGGMAIL_UI_DOMAIN}"
      - "WHERE_TO_ADDR=[::1]"
      - "WHERE_TO_PORT=80"
      - "DEBUG_LEVEL=INFO"
    networks:
      ipv6_pool_net:
        ipv6_address: ${YGGMAIL_UI_IPV6}
      ygg_pool_net:
        ipv6_address: ${YGGMAIL_UI_YGG}
    ports:
      # Expose https and http
      - 443/tcp
      - 80/tcp
