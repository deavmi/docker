include:
  # General network definitions
  - networks.yml

  # YggMail service
  - path: yggmail/compose.yml
    env_file:
      # Default env file
      - .env

      # YggMail specifics
      - .env.yggmail

      # YggMail secrets
      - .env.yggmail.secrets

  # paperlessNG service
  - path: paperless/compose.yml
    env_file:
      # Default env file
      - .env

      # Paperless specifics
      - .env.paperless

      # Paperless secrets
      - .env.paperless.secrets

  # Gpodder service
  - path: gpodder/compose.yml
    env_file:
      # Default env file
      - .env

      # Gpodder specifics
      - .env.gpodder

      # Gpodder secrets
      - .env.gpodder.secrets

  # Calibre service
  - path: calibre/compose.yml
    env_file:
      # Default env file
      - .env

      # Calibre specifics
      - calibre/.env.calibre

      # Calibre secrets
      - calibre/.env.calibre.secrets

  # Services
  - ntfy.yml
  - cryptpad/compose.yml


  
services:
  statistics:
    extends:
      file: ../../services/node_exporter/compose.yml
      service: statistics
    container_name: host_statistics

  yggdrasil:
    extends:
      file: ../../services/yggdrasil/compose.yml
      service: yggdrasil
    container_name: yggdrasil
    network_mode: "host"

  mycelium:
    extends:
      file: ../../services/mycelium/compose.yml
      service: mycelium
    container_name: mycelium
    network_mode: "host"

  web:
    container_name: web
    build:
      context: web/
    environment:
      - DOMAIN=${CADDY_DOMAIN}
    # ports:
      # - "80/tcp"
      # - "80/udp" # TODO: Does quick run on non-HTTPS?
      # - "443/tcp"
      # - "443/udp"
      # - "2019/tcp" # TODO: Remove this it is FULL ADMIN PORT (only prometheus must be accessing this)
