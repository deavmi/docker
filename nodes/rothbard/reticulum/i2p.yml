services:
  i2pd:
    extends:
      file: ../../../services/i2pd/compose.yml
      service: i2pd
      args:
        - NPROC=1
    user: ${USER_UID}:${USER_GID}
    # FIXME: Enable yggdrasil (somehow)
    # maybe by placing an Yggdrasil instance
    # here and putting them on the same `ns`
    # secrets:
      # - HTTP_CONSOLE_PASSWORD
    # command:
      # - "--datadir=/data"
      # - "--conf=/conf/i2pd.conf"

      # Main tunnel configuration file
      # and extras directory
      # - "--tunconf=/tunnels/tunnels.conf"
      # - "--tunnelsdir=/tunnels"

      # - "--loglevel=debug"

      # - "--ipv4=false"
      # - "--ipv6=true"
      # - "--meshnets.yggdrasil={$I2PD_YGGDRASIL_ENABLE:-false}"
      # - "--meshnets.yggaddress=${I2PD_YGGDRASIL_ADDRESS}"
      # - "--floodfill"
    environment:
      - I2PD_YGGDRASIL_ENABLE=true
      - I2PD_YGGDRASIL_ADDRESS=${RETICULUM_YGG_IPV6_ADDR}

      - I2P_FLOODFILL=false

      - I2P_ENABLE_IPV6=true
      - I2P_DISABLE_IPV4=true

      # - I2P_HTTP_CONSOLE_USER.=${I2P_HTTP_CONSOLE_USER}
      - I2P_HTTP_CONSOLE_ENABLE=false
      # - I2P_HTTP_CONSOLE_BIND_ADDR=${I2P_HTTP_CONSOLE_BIND_ADDR}
      # - I2P_HTTP_CONSOLE_BIND_PORT=${I2P_HTTP_CONSOLE_BIND_PORT}
      
      - I2P_LOG_LEVEL=${I2P_LOG_LEVEL:-error}

      # Enable I2PControl and set required ports
      # so that `i2pd_exporter` can access it
      # - I2P_CONTROL_ENABLED=${I2P_CONTROL_ENABLED}
      # - I2P_CONTROL_ADDR=${I2P_CONTROL_ADDR}
      # - I2P_CONTROL_PORT=${I2P_CONTROL_PORT}

    # Run in same network namespace as `reticulum`
    # so that we can bind to its network interface
    network_mode: service:reticulum
      # TODO: For Yggdrasil we mayneed to place
      # this into the same network namespace so
      # that i2pd can bind to the tun0 interface
      # TODO: Actually maybe not if host mode
      # is fine
    volumes:
      # Router data, all stuff that can be
      # deleted but is useful for caching
      - "${I2PD_DATA_DIR}:/data:z"
      
      # Configuration base path
      - "${I2PD_CONF_DIR}:/conf:z"
      
      # Tunnel key files
      - "${I2PD_KEYS_DIR}:/keys:z"

      # Tunnels directory
      - "${I2PD_TUNNELS_DIR}:/tunnels:z"

      # For mapping .i2pd
      - "${I2PD_DOT_DIR}:/.i2pd:z"

      
    # FIXME: Enable the below so that
    # they are allowed via the firewall
