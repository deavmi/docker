include:
  # Network definitions
  - networks.yml

  # Core services
  - path: core/core.yml
    env_file:
      # Defaults
      - .env

      # Defaults (openwebrx)
      - ./core/.env

  # OpenWebRX
  - path: openwebrx/openwebrx.yml
    env_file:
      # Defaults
      - .env

      # Defaults (openwebrx)
      - ./openwebrx/.env

