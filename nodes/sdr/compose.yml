include:
  # Network definitions
  - networks.yml

  # Core services
  - path: core/core.yml
    env_file:
      # Defaults
      - .env

      # Defaults (openwebrx)
      - ./core/.env

  # OpenWebRX
  - path: openwebrx/openwebrx.yml
    env_file:
      # Defaults
      - .env

      # Defaults (openwebrx)
      - ./openwebrx/.env

services:
  host-statistics:
    extends:
      file: ../../services/node_exporter/compose.yml
      service: statistics
    container_name: host_statistics

