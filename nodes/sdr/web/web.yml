services:
  web_proxy:
    build:
      context: image/
    restart: unless-stopped
    container_name: web_proxy
    environment:
      - "DOMAIN=${DOMAIN_1}"
      - "DOMAIN_1=${DOMAIN_2}"
      - "DOMAIN_2=${DOMAIN_3}"
    networks:
      - mainNet
    ports:
      - "80/tcp"
      - "80:80/udp" # TODO: Does quick run on non-HTTPS?
      - "443/tcp"
      - "443:443/udp"
