services:
  openwebrx:
    extends:
      file: ../../../services/openwebrxplus/compose.yml
      service: openwebrx
    devices:
      # - ${OPENWEBRX_DEVICE_1}:/dev/sdr0
      # TODO: According to https://fms.komkon.org/OWRX/#INSTALL-DOCKER
      - /dev/bus/usb:/dev/bus/usb

    # TODO: Move this to the service definition
    # (Use priveileged: https://www.reddit.com/r/synology/comments/rjs1k9/rtlsdr_device_not_visible_inside_openwebrx_docker/)
    privileged: true

    # FIXME: Remove ports and setup
    # caddy on the same network namespace
    # and then use that rather
    # network_mode: service:openwebrx_web
    networks:
      # - mainNet
      ipv6_pool_net:
        ipv6_address: ${OPENWEBRX_IPV6_ADDR_INTERNAL}
    # ports:
      # Port mapping
      # - 8073:8073/tcp

  openwebrx_web_ygg:
    build:
      context: web/
    restart: unless-stopped
    container_name: openwebrx_web_ygg
    environment:
      - "DOMAIN="
      - "DOMAIN_1="
      - "DOMAIN_2="
      - "MAP_TO_PORT=8073"
      - "MAP_TO_ADDR=openwebrx"
    # Because this is not on the `ipv6_pool_net` it won't
    # resolve container name's (services). Hence we must
    # force a mapping
    extra_hosts:
      - openwebrx=${OPENWEBRX_IPV6_ADDR_INTERNAL}
    networks:
      ygg_pool_net:
        ipv6_address: ${OPENWEBRX_YGG_ADDR}
    ports:
      - "80/tcp"
      - "80/udp" # TODO: Does quick run on non-HTTPS?
      - "443/tcp"
      - "443/udp"

  openwebrx_web_clear:
    build:
      context: web/
    restart: unless-stopped
    container_name: openwebrx_web_clear
    environment:
      - "DOMAIN=${OPENWEBRX_DOMAIN_1}"
      - "DOMAIN_1=${OPENWEBRX_DOMAIN_2}"
      - "DOMAIN_2=${OPENWEBRX_DOMAIN_3}"
      - "MAP_TO_PORT=8073"
      - "MAP_TO_ADDR=openwebrx"
    networks:
      ipv6_pool_net:
        ipv6_address: ${OPENWEBRX_IPV6_ADDR}
    ports:
      - "80/tcp"
      - "80/udp" # TODO: Does quick run on non-HTTPS?
      - "443/tcp"
      - "443/udp"
