services:
  mumble:
    image: mumblevoip/mumble-server:latest-acme
    container_name: mumble
    restart: unless-stopped
    user: ${USER_UID}:${USER_GID}
    networks:
      ipv6_pool_net:
        ipv6_address: ${MUMBLE_IPV6_ADDR}
      ygg_pool_net:
        ipv6_address: ${MUMBLE_YGG_ADDR}
    environment:
      # Welcome text
      - "MUMBLE_CONFIG_WELCOMETEXT=Welcome to the NovasRedes VOIP conference server!"
      
      # TLS ceritifcate generation
      - ACME_DOMAIN=mumble.telekom.deavmi.org
      - ACME_ACCOUNT_EMAIL=deavmi@redxen.eu
      - ACME_HTTP=1
    ports:
      # Allow through firewall
      - 64738/tcp # Control port
      - 64738/udp # Voice port

      # For ACME verification
      - 80/tcp
    volumes:
      # State directory and configuration file
      - ${MUMBLE_STATE_DIR}:/data:z

      # Logging directory (needed for supervisord
      # when using the ACME image variant)
      - ${MUMBLE_LOG_DIR}:/var/log:z

      # ACME directory
      - ${MUMBLE_ACME_DIR}:/etc/acme:z
