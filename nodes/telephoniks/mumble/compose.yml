services:
  mumble:
    image: mumblevoip/mumble-server:latest
    container_name: mumble
    restart: unless-stopped
    user: ${USER_UID}:${USER_GID}
    networks:
      ipv6_pool_net:
        ipv6_address: ${MUMBLE_IPV6_ADDR}
      ygg_pool_net:
        ipv6_address: ${MUMBLE_YGG_ADDR}
    environment:
      # TLS ceritifcate generation
      - ACME_DOMAIN=mumble.telekom.deavmi.org
      - ACME_ACCOUNT_EMAIL=deavmi@redxen.eu
      - ACME_HTTP=1
    ports:
      # Allow through firewall
      - 64738/tcp # Control port
      - 64738/udp # Voice port

      # For ACME verification
      - 80/tcp
    volumes:
      # State directory and configuration file
      - ${MUMBLE_STATE_DIR}:/data:z
